services:
  - type: web
    name: jabed-youtube-music-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_KEY
        sync: false
      - key: YT_COOKIES
        sync: false
